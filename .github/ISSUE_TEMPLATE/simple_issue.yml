name: 이슈 발행
description: 무엇을, 왜 형식의 간단한 이슈
title: "[issue]: "
labels: [ ]
body:
  - type: dropdown
    id: type
    attributes:
      label: 이슈 유형
      description: 이 이슈의 성격을 선택해주세요
      options:
        - feature
        - bug
        - fix
        - docs
        - refactor
      default: 0
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      description: 처리 우선순위를 선택해주세요
      options:
        - critical
        - high
        - medium
        - low
      default: 2
    validations:
      required: true

  - type: checkboxes
    id: area
    attributes:
      label: 영향 범위
      description: 관련된 영역을 모두 선택해주세요 (복수 선택 가능)
      options:
        - label: frontend
        - label: backend
        - label: app
        - label: planner
        - label: devops

  - type: input
    id: what
    attributes:
      label: what
      description: 구체적인 작업, 문제, 또는 요구사항을 작성해주세요
      placeholder: 예) 로그인 시 토큰 만료 오류 수정, 대시보드에 새로운 차트 추가, API 응답 속도 개선
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: why
      description: 이 작업이 필요한 이유, 배경, 비즈니스 영향을 상세히 설명해주세요
      placeholder: |
        예시:
        - 현재 상황: 사용자가 30분마다 재로그인 필요
        - 문제점: 업무 효율성 저하 및 사용자 불만 증가
        - 기대효과: 세션 유지 시간 연장으로 사용자 경험 개선
        - 우선순위: 긴급 (일일 100건 이상의 문의 발생 중)
    validations:
      required: true
